<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hypertrophy Journal{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #16181d;
      --surface2:  #1e2028;
      --border:    #2a2d36;
      --text:      #e8eaf0;
      --muted:     #7a7f93;
      --accent:    #f97316;
      --accent-dk: #c2570d;
      --green:     #22c55e;
      --red:       #ef4444;
      --radius:    10px;
      --shadow:    0 2px 12px rgba(0,0,0,0.45);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 24px;
    }
    nav .brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--text); }

    /* ── LAYOUT ── */
    .page { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    /* ── HEADINGS ── */
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    h2 { font-size: 17px; font-weight: 600; color: var(--muted); margin-bottom: 16px; }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 20px; }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    /* ── BADGE / LABEL ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(249,115,22,0.15);
      color: var(--accent);
      margin-bottom: 16px;
    }

    /* ── META LINE ── */
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .meta strong { color: var(--text); }

    /* ── TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: var(--surface2); }

    /* ── FORM ── */
    .form-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .form-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .form-table td { padding: 6px 6px; }
    .form-table input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-table input:focus { border-color: var(--accent); }
    .form-table input::placeholder { color: var(--muted); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-dk); }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

    /* ── HOME GRID ── */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .day-card:hover { border-color: var(--accent); background: var(--surface2); }
    .day-card .day-label { font-weight: 700; font-size: 15px; }
    .day-card .day-sub { font-size: 12px; color: var(--muted); }

    /* ── HISTORY LIST ── */
    .history-list { list-style: none; }
    .history-list li + li { border-top: 1px solid var(--border); }
    .history-list a {
      display: block;
      padding: 12px 0;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s;
    }
    .history-list a:hover { color: var(--accent); }

    /* ── SELECTS ── */
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    select:focus { border-color: var(--accent); }
    label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); display: block; margin-bottom: 6px; }

    /* ── HINT TEXT ── */
    .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }

    /* ── SECTION HEADER ── */
    .section-header { margin-bottom: 20px; }
    .section-header h2 { font-size: 19px; color: var(--text); margin-bottom: 2px; }
    .section-header p { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">Hypertrophy Journal</a>
    <a href="/">Workouts</a>
    <a href="/progress">Progress</a>
  </nav>

  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
