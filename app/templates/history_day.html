<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ day_label }} History</title>
</head>
<body>
      <a href="/">← Back</a>
    <h1>{{ day_label }} History</h1>

    {% if workouts|length == 0 %}
      <p>No workouts logged yet.</p>
    {% else %}
      <ul>
        {% for w in workouts %}
          <li>
            <a href="/workout/{{ w['id'] }}">{{ w["date"] }}</a>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
</body>
</html>
