<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Journal</title>
</head>
<body>
    <h1>Gym Journal</h1>
    <p>Select your workout day:</p>

    <ul>
      {% for value, label in day_types %}
        <li>
          <a href="/workout/start?day_type={{ value }}">{{ label }}</a>
        </li>
      {% endfor %}
    </ul>
    <h2>History</h2>
<ul>
  {% for value, label in day_types %}
    <li><a href="/history/{{ value }}">View {{ label }} days</a></li>
  {% endfor %}
</ul>
</body>
</html>
