<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hyper Trophy</title>
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyper Trophy">
<meta name="theme-color" content="#15130F">
<style>
  :root{
    --bg:#15130F;
    --surface:#211E17;
    --surface2:#2A261C;
    --line:#3A3527;
    --chalk:#EDE8DC;
    --muted:#8B8579;
    --accent:#E8B92B;
    --accent-dim:#5C4C17;
    --steel:#5B7A87;
    --danger:#B24A3C;
    --accent-text:#1A1509;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    overscroll-behavior-y:none;
  }
  h1,h2,h3{margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; letter-spacing:-0.01em;}
  .num{font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:-0.02em;}
  header.top{
    padding:22px 20px 16px; position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  header.top .eyebrow{color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;}
  header.top h1{font-size:26px; font-weight:800; margin-top:2px;}
  main{padding:0 16px 24px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Bottom nav ---- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--muted);
    font-size:11px; font-weight:600; letter-spacing:.02em;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; font-family:inherit;
  }
  nav.tabs button svg{width:22px; height:22px; stroke:var(--muted); fill:none; stroke-width:1.8;}
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button.active svg{stroke:var(--accent);}

  /* ---- Cards ---- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px;
  }
  .card-title{font-size:15px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .muted{color:var(--muted);}
  .pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px;
    border-radius:20px; background:var(--accent-dim); color:var(--accent); letter-spacing:.03em;
  }

  /* ---- Buttons / inputs ---- */
  button{cursor:pointer;}
  .btn{
    background:var(--accent); color:#1A1509; border:none; border-radius:11px;
    font-weight:800; font-size:15px; padding:13px 16px; width:100%;
    font-family:inherit; letter-spacing:.01em;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--surface2); color:var(--chalk); border:1px solid var(--line);}
  .btn.ghost{background:none; color:var(--steel); border:1px dashed var(--line); font-weight:700;}
  .btn.danger{background:none; color:var(--danger); border:1px solid var(--danger);}
  input, select{
    background:var(--surface2); border:1px solid var(--line); color:var(--chalk);
    border-radius:9px; padding:11px 12px; font-size:16px; font-family:inherit; width:100%;
  }
  input::placeholder{color:var(--muted);}
  /* iOS Safari gives date/time inputs an intrinsic width that ignores width:100%
     and spills out of the card. Reset it so they stay inside their container. */
  input[type="date"], input[type="time"]{
    -webkit-appearance:none; appearance:none;
    display:block; box-sizing:border-box; min-width:0; max-width:100%;
    min-height:46px; text-align:left;
  }
  input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value{text-align:left;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  label.field{display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:12px 0 5px;}
  label.field:first-child{margin-top:0;}

  /* ---- Set chips ---- */
  .set-list{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .set-chip{
    background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .set-chip .x{color:var(--muted); font-weight:400;}
  .set-chip button{background:none; border:none; color:var(--danger); font-size:15px; font-weight:800; padding:0; line-height:1;}

  /* ---- Exercise block in log ---- */
  .exercise-block{border-top:1px solid var(--line); padding-top:12px; margin-top:12px;}
  .exercise-block:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .exercise-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .exercise-head h3{font-size:15px; font-weight:700;}
  .exercise-head button.remove{background:none; border:none; color:var(--muted); font-size:18px; padding:2px 6px;}

  /* ---- History ---- */
  .day-card .day-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .day-head .date{font-weight:800; font-size:15px;}
  .ex-row{padding:8px 0; border-top:1px solid var(--line);}
  .ex-row:first-child{border-top:none;}
  .ex-row .ex-name{font-weight:700; font-size:13.5px; margin-bottom:3px;}
  .ex-row .sets{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .ex-row .sets b{color:var(--chalk); font-weight:700;}
  .empty{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty .big{font-size:15px; font-weight:700; color:var(--chalk); margin-bottom:6px;}

  /* ---- Progress ---- */
  select#progressExercise{margin-bottom:12px;}
  .stat-row{display:flex; gap:10px; margin-bottom:14px;}
  .stat{flex:1; background:var(--surface2); border-radius:10px; padding:12px; text-align:center;}
  .stat .v{font-size:20px; font-weight:800; color:var(--accent);}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .chart-wrap{background:var(--surface2); border-radius:10px; padding:14px 10px 6px;}
  svg.chart{width:100%; height:150px; display:block;}
  .prog-log{margin-top:10px;}
  .prog-log-row{display:flex; justify-content:space-between; padding:9px 2px; border-top:1px solid var(--line); font-size:13px;}
  .prog-log-row:first-child{border-top:none;}

  /* ---- Calendar ---- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-month-label{font-size:16px; font-weight:800;}
  .cal-nav-btn{
    background:var(--surface2); border:1px solid var(--line); color:var(--chalk);
    border-radius:9px; width:34px; height:34px; font-size:18px; font-weight:700;
    font-family:inherit; line-height:1;
  }
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:8px;
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; border-radius:10px; font-size:14px; font-weight:600; color:var(--chalk);
    background:none; border:1px solid transparent; font-family:inherit;
    padding:0; margin:0; appearance:none; -webkit-appearance:none; cursor:pointer;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.selected{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
  .cal-dot{width:5px; height:5px; border-radius:50%; background:#3FAE5C;}
  .cal-cell.selected .cal-dot{background:var(--accent-text);}
  .cal-dot-spacer{width:5px; height:5px;}
  .cal-day-detail{margin-top:12px;}

  /* ---- Workout time (start / end) ---- */
  .time-row{display:flex; gap:10px; margin-top:4px;}
  .time-col{flex:1; min-width:0;}
  .time-col .time-input-wrap{display:flex; gap:6px;}
  .time-col input[type="time"]{flex:1; min-width:0;}
  .now-btn{
    background:var(--surface2); border:1px solid var(--line); color:var(--muted);
    border-radius:12px; padding:0 12px; height:44px; font-size:12px; font-weight:800;
    font-family:inherit; letter-spacing:.02em;
  }
  .duration-chip{
    margin-top:10px; font-size:12.5px; font-weight:700; color:var(--accent);
    background:var(--accent-dim); border-radius:9px; padding:7px 11px; display:none;
  }
  .time-text{font-size:12px; color:var(--muted); font-weight:600; margin:-2px 0 8px;}

  /* ---- Draft original-date note ---- */
  .draft-note{
    background:var(--accent-dim); color:var(--accent); font-size:12.5px; font-weight:700;
    padding:9px 12px; border-radius:9px; margin-bottom:12px; display:none;
  }

  /* modal */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:none;
  }
  .sheet-backdrop.active{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    background:var(--surface); border-radius:18px 18px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease;
    max-height:80vh; overflow-y:auto;
  }
  .sheet.active{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .field-with-toggle{display:flex; gap:8px; align-items:flex-end;}
  .unit-toggle{
    background:var(--surface2); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:0 16px; height:44px; font-size:13px; font-weight:800;
    font-family:inherit; white-space:nowrap; letter-spacing:.02em;
  }
  .unit-toggle.active{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
  .quick-set > div{flex:1;}

  /* ---- Last-session history panel inside the sheet ---- */
  #sheetHistory{margin-top:2px;}
  .hist-panel{
    background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-top:8px;
  }
  .hist-panel .hist-title{
    font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:6px;
  }
  .hist-row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid var(--line); font-size:13px;}
  .hist-row:first-child{border-top:none;}
  .hist-row .hist-date{color:var(--muted); white-space:nowrap; font-weight:600; font-size:12px;}
  .hist-row .hist-sets{text-align:right; font-weight:700;}
  .hist-row .hist-sets .x{color:var(--muted); font-weight:400;}
  .hist-best{
    display:flex; justify-content:space-between; align-items:center; margin-top:2px;
    padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--accent); font-weight:700;
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow" id="headerEyebrow">Log</div>
  <h1 id="headerTitle">Today's Lift</h1>
</header>

<main>

  <!-- LOG VIEW -->
  <section class="view active" id="view-log">
    <div id="draftOriginalDateNote" class="draft-note"></div>
    <div class="card">
      <label class="field">Split / Day</label>
      <select id="splitSelect"></select>
      <input id="splitNameNew" placeholder="New split name" style="display:none; margin-top:8px;">
      <div id="splitHistory"></div>
      <label class="field">Date</label>
      <input id="logDate" type="date">
      <div class="time-row">
        <div class="time-col">
          <label class="field">Start time</label>
          <div class="time-input-wrap">
            <input id="startTime" type="time">
            <button type="button" class="now-btn" id="startNowBtn">Now</button>
          </div>
        </div>
        <div class="time-col">
          <label class="field">End time</label>
          <div class="time-input-wrap">
            <input id="endTime" type="time">
            <button type="button" class="now-btn" id="endNowBtn">Now</button>
          </div>
        </div>
      </div>
      <div class="duration-chip" id="durationChip"></div>
    </div>

    <div id="exerciseBlocks"></div>

    <button class="btn ghost" id="addExerciseBtn" style="margin-bottom:14px;">+ Add exercise</button>
    <button class="btn" id="saveWorkoutBtn">Save workout</button>
  </section>

  <!-- HISTORY VIEW -->
  <section class="view" id="view-history">
    <div id="historyList"></div>
    <div class="card" id="backupCard">
      <div class="card-title">Backup</div>
      <div class="muted" style="font-size:13px; margin-bottom:12px;">
        Your logs live only on this device. Export a backup file every so often, or before switching phones.
      </div>
      <div class="row">
        <button class="btn secondary" id="exportBtn">Export data</button>
        <button class="btn secondary" id="importBtn">Import data</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </section>

  <!-- PROGRESS VIEW -->
  <section class="view" id="view-progress">
    <select id="progressExercise"></select>
    <div id="progressBody"></div>
  </section>

  <!-- CALENDAR VIEW -->
  <section class="view" id="view-calendar">
    <div class="card">
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrevBtn">‹</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button class="cal-nav-btn" id="calNextBtn">›</button>
      </div>
      <div class="cal-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div id="calDayDetail"></div>
  </section>

</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="exerciseSheet">
  <div class="sheet-handle"></div>
  <label class="field">Exercise name</label>
  <select id="sheetExerciseSelect"></select>
  <input id="sheetExerciseNameNew" placeholder="New exercise name" style="display:none; margin-top:8px;" autocomplete="off">
  <div id="sheetHistory"></div>
  <div class="field-with-toggle">
    <div style="flex:1;">
      <label class="field">Weight (optional)</label>
      <input id="sheetWeight" type="number" inputmode="decimal" placeholder="180">
    </div>
    <button type="button" class="unit-toggle" id="bwToggle">BW</button>
  </div>
  <div class="field-with-toggle" style="margin-top:12px;">
    <div style="flex:1;">
      <label class="field" id="sheetRepsLabel">Reps</label>
      <input id="sheetReps" type="number" inputmode="numeric" placeholder="10">
    </div>
    <button type="button" class="unit-toggle" id="timedToggle">Timed</button>
  </div>
  <button class="btn secondary" id="sheetAddSetBtn" style="margin-top:12px; padding:11px;">Add set</button>
  <div id="sheetWarn" style="display:none; margin-top:8px; font-size:13px; font-weight:600; color:#D93A3A;"></div>
  <div class="set-list" id="sheetSetList"></div>
  <button class="btn" id="sheetDoneBtn" style="margin-top:6px;">Done</button>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-view="log">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
    Log
  </button>
  <button class="tab-btn" data-view="history">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    History
  </button>
  <button class="tab-btn" data-view="progress">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg>
    Progress
  </button>
  <button class="tab-btn" data-view="calendar">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round"/></svg>
    Calendar
  </button>
</nav>

<script>

const STORE_KEY = 'ironlog.workouts.v1';

function loadWorkouts(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedData();
}
function saveWorkouts(){
  localStorage.setItem(STORE_KEY, JSON.stringify(workouts));
}

   now available only via the explicit "Load sample data" action below, so friends
   who open a shared link still see a genuinely empty log by default.) */

/* Autosaves the in-progress workout (split, date, exercises, sets) so it survives
   switching tabs, closing the app, or a phone lock, until it's actually saved or deleted.
   Also remembers the date the draft was originally started on (draftOriginalDate), separate
   from the editable date field, since the date field always resets to today on reload. */
function saveDraft(){
  if(draftExercises.length === 0){
    draftOriginalDate = null;
  } else if(draftOriginalDate === null){
    draftOriginalDate = document.getElementById('logDate').value;
  }
  const draft = {
    date: document.getElementById('logDate').value,
    split: getCurrentSplitName(),
    exercises: draftExercises,
    originalDate: draftOriginalDate,
    startTime: document.getElementById('startTime').value,
    endTime: document.getElementById('endTime').value
  };
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); }catch(e){ /* storage unavailable, draft just won't persist */ }
  renderDraftNote();
}
function clearDraft(){
  draftOriginalDate = null;
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  renderDraftNote();
}
function loadDraft(){
  let raw;
  try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ return; }
  if(draft.exercises && draft.exercises.length){
    draftExercises = draft.exercises;
    draftOriginalDate = draft.originalDate || draft.date || null;
  }
  // Start/end times belong to the unfinished workout itself, so unlike the date they do restore.
  if(draft.startTime) document.getElementById('startTime').value = draft.startTime;
  if(draft.endTime) document.getElementById('endTime').value = draft.endTime;
  updateDurationChip();
  // Intentionally NOT restoring draft.date here: the date field should always default to
  // today on load (already set above), not silently jump back to whenever an unfinished
  // draft was originally started. If you're finishing an old draft on a later day, set the
  // date yourself; it'll autosave from that point on same as everything else.
  if(draft.split){
    const sel = document.getElementById('splitSelect');
    const newInput = document.getElementById('splitNameNew');
    const optionExists = [...sel.options].some(o => o.value === draft.split);
    if(optionExists){
      sel.value = draft.split;
      newInput.style.display = 'none';
      newInput.value = '';
    } else {
      sel.value = NEW_VALUE;
      newInput.style.display = 'block';
      newInput.value = draft.split;
    }
    renderSplitHistory();
  }
  renderDraftNote();
}

}

/* ---- Workout start/end time ---- */
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
/* Minutes between two HH:MM strings. If end is earlier than start, assume the
   workout ran past midnight and roll the end to the next day. */
function minutesBetween(start, end){
  if(!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh*60 + em) - (sh*60 + sm);
  if(diff < 0) diff += 24*60;
  return diff;
}
function formatDuration(mins){
  if(mins === null || mins === undefined) return '';
  const h = Math.floor(mins/60), m = mins % 60;
  if(h === 0) return `${m}m`;
  if(m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}
function formatClock(hhmm){
  if(!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const suffix = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2,'0')} ${suffix}`;
}
/* "6:30 PM – 7:45 PM · 1h 15m", or just the start/end if only one was logged. */
function formatTimeSummary(w){
  if(w.startTime && w.endTime){
    return `${formatClock(w.startTime)} – ${formatClock(w.endTime)} · ${formatDuration(minutesBetween(w.startTime, w.endTime))}`;
  }
  if(w.startTime) return `Started ${formatClock(w.startTime)}`;
  if(w.endTime) return `Ended ${formatClock(w.endTime)}`;
  return '';
}
function updateDurationChip(){
  const chip = document.getElementById('durationChip');
  const mins = minutesBetween(document.getElementById('startTime').value, document.getElementById('endTime').value);
  if(mins === null){
    chip.style.display = 'none';
    chip.textContent = '';
  } else {
    chip.textContent = `Workout length: ${formatDuration(mins)}`;
    chip.style.display = 'block';
  }
}

/* Look up the most recent sessions for a given exercise name (case-insensitive, trimmed match) */
function getExerciseHistory(name, limit=5){
  const target = name.trim().toLowerCase();
  if(!target) return [];
  const hits = [];
  [...workouts].sort((a,b)=> b.date.localeCompare(a.date)).forEach(w=>{
    w.exercises.forEach(ex=>{
      if(ex.name.trim().toLowerCase() === target && ex.sets.length){
        hits.push({ date: w.date, sets: ex.sets });
      }
    });
  });
  return hits.slice(0, limit);
}

/* Adds whatever is typed in the set fields to the current exercise.
   Returns 'empty' if nothing was typed, 'added' if a set was saved,
   or 'invalid' if the fields are partly filled and can't form a set. */
function commitPendingSet(){
  const weightRaw = document.getElementById('sheetWeight').value.trim();
  const repsRaw = document.getElementById('sheetReps').value.trim();
  const weightTyped = !sheetIsBodyweight && weightRaw !== '';
  if(!weightTyped && repsRaw === '') return 'empty';
  const w = sheetIsBodyweight ? null : (weightRaw === '' ? null : parseFloat(weightRaw));
  const r = parseInt(repsRaw);
  if((weightTyped && isNaN(w)) || isNaN(r)) return 'invalid';
  draftExercises[editingIndex].sets.push({ w, bw: sheetIsBodyweight, r, unit: sheetIsTimed ? 'sec' : 'reps' });
  document.getElementById('sheetReps').value = '';
  renderSheetSets();
  return 'added';
}

/* Every distinct exercise ever logged under this split, each with its most recent sets.
   Sorted by most recently done first, so exercises you skipped last time still surface
   from an earlier session instead of disappearing. */
function getAllExercisesForSplit(name){
  const target = name.trim().toLowerCase();
  if(!target) return [];
  const bySplit = workouts
    .filter(w => w.split.trim().toLowerCase() === target)
    .sort((a,b)=> b.date.localeCompare(a.date));

  const seen = new Map(); // exercise name (lowercased) -> { name, date, sets }
  bySplit.forEach(w=>{
    w.exercises.forEach(ex=>{
      const key = ex.name.trim().toLowerCase();
      if(!seen.has(key) && ex.sets.length){
        seen.set(key, { name: ex.name, date: w.date, sets: ex.sets });
      }
    });
  });
  return [...seen.values()].sort((a,b)=> b.date.localeCompare(a.date));
}

function renderSplitHistory(){
  const name = getCurrentSplitName();
  const panel = document.getElementById('splitHistory');
  const exercises = getAllExercisesForSplit(name);
  if(!exercises.length){
    panel.innerHTML = '';
    return;
  }
  const rows = exercises.map(ex=>{
    const top = topWeightedSet(ex.sets);
    const label = top ? `${top.w}<span class="x">×</span>${top.r} top` : formatSetHtml(ex.sets[0]);
    return `<div class="hist-row"><span>${escapeHtml(ex.name)}<br><span class="hist-date">${formatDate(ex.date)}</span></span><span class="hist-sets">${label}</span></div>`;
  }).join('');
  panel.innerHTML = `
    <div class="hist-panel">
      <div class="hist-title">Everything logged on ${escapeHtml(name)}</div>
      ${rows}
      <button class="btn secondary" id="useLastExercisesBtn" style="margin-top:10px; padding:9px;">Use these exercises</button>
    </div>`;
  document.getElementById('useLastExercisesBtn').addEventListener('click', ()=>{
    exercises.forEach(ex=>{
      if(!draftExercises.some(d => d.name.trim().toLowerCase() === ex.name.trim().toLowerCase())){
        draftExercises.push({ name: ex.name, sets: [] });
      }
    });
    renderExerciseBlocks();
  });
}

populateSplitSelect();
loadDraft();
renderExerciseBlocks();

/* ---------------- History view ---------------- */
function renderHistory(){
  const list = document.getElementById('historyList');
  if(!workouts.length){
    list.innerHTML = `<div class="empty"><div class="big">No workouts logged</div>Log your first lift to see it here.<br><button class="btn ghost" id="loadSampleBtn" style="margin-top:16px; max-width:220px; margin-left:auto; margin-right:auto;">Load sample data</button></div>`;
    document.getElementById('loadSampleBtn').addEventListener('click', ()=>{
      loadSampleData();
      populateSplitSelect();
      renderHistory();
    });
    return;
  }
  const sorted = [...workouts].sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(w=>{
    const rows = w.exercises.map(ex=>{
      const setsText = ex.sets.map(s=>formatSetHtml(s)).join(', ');
      return `<div class="ex-row"><div class="ex-name">${escapeHtml(ex.name)}</div><div class="sets">${setsText}</div></div>`;
    }).join('');
    return `
      <div class="card day-card">
        <div class="day-head">
          <div class="date">${formatDate(w.date)}</div>
          <span class="pill">${escapeHtml(w.split)}</span>
        </div>
        ${formatTimeSummary(w) ? `<div class="time-text">${formatTimeSummary(w)}</div>` : ''}
        ${rows}
        <button class="btn danger" data-del="${w.id}" style="margin-top:12px; padding:9px;">Delete workout</button>
      </div>`;
  }).join('');
  list.querySelectorAll('button[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(confirm('Delete this workout?')){
        workouts = workouts.filter(w=>w.id!==b.dataset.del);
        saveWorkouts();
        renderHistory();
      }
    });
  });
}

/* ---------------- Backup: export / import ---------------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = {
    app: 'Hyper Trophy',
    exportedAt: new Date().toISOString(),
    workouts
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `hyper-trophy-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.workouts;
      if(!Array.isArray(incoming)) throw new Error('No workouts found in this file.');

      const existingIds = new Set(workouts.map(w=>w.id));
      let added = 0;
      incoming.forEach(w=>{
        if(!w.id || !existingIds.has(w.id)){
          workouts.push({ ...w, id: w.id && !existingIds.has(w.id) ? w.id : cryptoId() });
          added++;
        }
      });
      saveWorkouts();
      populateSplitSelect();
      renderHistory();
      alert(`Imported ${added} workout${added===1?'':'s'}.`);
    }catch(err){
      alert('Could not read that file. Make sure it\'s a Hyper Trophy backup export.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});
function allExerciseNames(){
  const names = new Set();
  workouts.forEach(w=>w.exercises.forEach(e=>names.add(e.name)));
  return [...names].sort((a,b)=>a.localeCompare(b));
}

function renderProgress(){
  const sel = document.getElementById('progressExercise');
  const names = allExerciseNames();
  if(!names.length){
    document.getElementById('progressBody').innerHTML = `<div class="empty"><div class="big">Nothing to chart yet</div>Log a few workouts first.</div>`;
    sel.innerHTML = '';
    return;
  }
  const prevVal = sel.value;
  sel.innerHTML = names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  sel.value = names.includes(prevVal) ? prevVal : names[0];
  drawProgress(sel.value);
}
document.getElementById('progressExercise').addEventListener('change', e=>drawProgress(e.target.value));

function drawProgress(exerciseName){
  const points = [];
  [...workouts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
    w.exercises.forEach(ex=>{
      if(ex.name === exerciseName && ex.sets.length){
        const top = topWeightedSet(ex.sets);
        const volume = ex.sets.reduce((sum,s)=> sum + (typeof s.w === 'number' ? s.w*s.r : 0), 0);
        points.push({ date:w.date, top, volume, sets:ex.sets });
      }
    });
  });

  const body = document.getElementById('progressBody');
  if(!points.length){ body.innerHTML = `<div class="empty">No data for this exercise.</div>`; return; }

  const weightedPoints = points.filter(p => p.top !== null);

  const logRows = [...points].reverse().map(p=>{
    const setsText = p.sets.map(s=>formatSetHtml(s)).join(', ');
    return `<div class="prog-log-row"><span class="muted">${formatDate(p.date)}</span><span>${setsText}</span></div>`;
  }).join('');

  if(!weightedPoints.length){
    // Every session for this exercise so far is planned (rep targets only, no weight yet).
    body.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="v">${points.length}</div><div class="l">Planned sessions</div></div>
      </div>
      <div class="muted" style="font-size:13px; margin-bottom:10px;">No weight logged yet for this exercise, so there's nothing to chart. Add a weight next time you do it and a trend line will appear here.</div>
      <div class="prog-log">${logRows}</div>
    `;
    return;
  }

  const best = weightedPoints.reduce((m,p)=> p.top.w>m.top.w ? p : m, weightedPoints[0]);
  const last = weightedPoints[weightedPoints.length-1];

  const w = 320, h = 150, pad = 16;
  const maxW = Math.max(...weightedPoints.map(p=>p.top.w)) * 1.1;
  const minW = Math.min(...weightedPoints.map(p=>p.top.w)) * 0.9;
  const range = (maxW-minW) || 1;
  const stepX = weightedPoints.length>1 ? (w-pad*2)/(weightedPoints.length-1) : 0;
  const coords = weightedPoints.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((p.top.w-minW)/range)*(h-pad*2);
    return {x,y,p};
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${h-pad} L${coords[0].x.toFixed(1)},${h-pad} Z`;

  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.2" fill="#E8B92B"/>`).join('');

  body.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="v">${best.top.w}<span style="font-size:12px">lb</span></div><div class="l">Best top set</div></div>
      <div class="stat"><div class="v">${last.top.w}<span style="font-size:12px">lb</span></div><div class="l">Last top set</div></div>
      <div class="stat"><div class="v">${points.length}</div><div class="l">Sessions</div></div>
    </div>
    <div class="chart-wrap">
      <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <path d="${areaD}" fill="rgba(232,185,43,0.12)" stroke="none"/>
        <path d="${pathD}" fill="none" stroke="#E8B92B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
    </div>
    <div class="prog-log">${logRows}</div>
  `;
}

/* ---------------- Calendar view ---------------- */
let calendarViewDate = new Date();
calendarViewDate.setDate(1);
let selectedCalendarDate = null;

document.getElementById('calPrevBtn').addEventListener('click', ()=>{
  calendarViewDate.setMonth(calendarViewDate.getMonth()-1);
  renderCalendar();
});
document.getElementById('calNextBtn').addEventListener('click', ()=>{
  calendarViewDate.setMonth(calendarViewDate.getMonth()+1);
  renderCalendar();
});

function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getWorkoutsForDate(dateStr){
  return workouts.filter(w => w.date === dateStr);
}

function renderCalendar(){
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthLabel = calendarViewDate.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  document.getElementById('calMonthLabel').textContent = monthLabel;

  const gymDates = new Set(workouts.map(w=>w.date));
  const todayStr = toLocalISODate(new Date());

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const grid = document.getElementById('calGrid');
  let cells = '';
  for(let i=0; i<startWeekday; i++){
    cells += `<div class="cal-cell empty"></div>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateObj = new Date(year, month, day);
    const dateStr = toLocalISODate(dateObj);
    const hasWorkout = gymDates.has(dateStr);
    const classes = ['cal-cell'];
    if(dateStr === todayStr) classes.push('today');
    if(dateStr === selectedCalendarDate) classes.push('selected');
    const dotHtml = hasWorkout ? '<span class="cal-dot"></span>' : '<span class="cal-dot-spacer"></span>';
    cells += `<button class="${classes.join(' ')}" data-date="${dateStr}">${day}${dotHtml}</button>`;
  }
  grid.innerHTML = cells;

  grid.querySelectorAll('.cal-cell[data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedCalendarDate = btn.dataset.date;
      renderCalendar();
      renderCalDayDetail();
    });
  });

  renderCalDayDetail();
}

function renderCalDayDetail(){
  const panel = document.getElementById('calDayDetail');
  if(!selectedCalendarDate){
    panel.innerHTML = '';
    return;
  }
  const dayWorkouts = getWorkoutsForDate(selectedCalendarDate);
  const label = formatDate(selectedCalendarDate);
  if(!dayWorkouts.length){
    panel.innerHTML = `<div class="card cal-day-detail"><div class="card-title">${label}</div><div class="muted" style="font-size:13px;">No workout logged this day.</div></div>`;
    return;
  }
  const body = dayWorkouts.map(w=>{
    const rows = w.exercises.map(ex=>{
      const setsText = ex.sets.map(s=>formatSetHtml(s)).join(', ');
      return `<div class="ex-row"><div class="ex-name">${escapeHtml(ex.name)}</div><div class="sets">${setsText}</div></div>`;
    }).join('');
    return `<div class="card cal-day-detail"><div class="day-head"><div class="date">${label}</div><span class="pill">${escapeHtml(w.split)}</span></div>${formatTimeSummary(w) ? `<div class="time-text">${formatTimeSummary(w)}</div>` : ''}${rows}</div>`;
  }).join('');
  panel.innerHTML = body;
}

/* ---------------- Helpers ---------------- */
/* A set with no weight entered (planning/prep mode) is stored as w: null.
   These two helpers keep every display and stat calculation null-safe in one place. */
function formatSetHtml(s){
  const unit = s.unit === 'sec' ? 'sec' : 'reps';
  const countText = unit === 'sec' ? `${s.r}s` : `${s.r}`;
  const sep = unit === 'sec' ? ' · ' : '×';
  if(s.bw){
    return `<b>BW</b>${sep}${countText}`;
  }
  if(s.w !== null && s.w !== undefined && s.w !== ''){
    return `<b>${s.w}</b>${sep}${countText}`;
  }
  return unit === 'sec' ? `${countText}` : `${countText} reps`;
}
function topWeightedSet(sets){
  const weighted = sets.filter(s => typeof s.w === 'number' && !isNaN(s.w));
  if(!weighted.length) return null;
  return weighted.reduce((m,s)=> s.w>m.w ? s : m, weighted[0]);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

/* Belt-and-suspenders: also catch app close/backgrounding even if some interaction
   somehow missed an explicit saveDraft() call above. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') saveDraft();
});
window.addEventListener('pagehide', saveDraft);

/* Offline support: cache the app shell on first successful load so it opens
   without a network connection afterward. sw.js must be deployed alongside this file. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching unavailable, app still works online */ });
  });
}
